<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 360" width="100%" height="100%" fill="none">
  <defs>
    <!-- 3D Shadow Filters & Gradients -->
    <filter id="subtle-shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <g id="cholti-mart-official-logo" transform="translate(10, 10)">
    <!-- 1. Shopping Cart Icon above the 'O' -->
    <g id="cart-icon" transform="translate(162, 28)">
      <!-- Cart Handle & Basket Frame -->
      <path d="M 4 8 L 18 8 L 30 52 L 68 52 L 78 18 L 16 18" 
            stroke="#0B6B3A" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      <!-- Cart Basket Wire Slats -->
      <line x1="28" y1="26" x2="68" y2="26" stroke="#0B6B3A" stroke-width="3" stroke-linecap="round" />
      <line x1="33" y1="36" x2="65" y2="36" stroke="#0B6B3A" stroke-width="3" stroke-linecap="round" />
      <line x1="37" y1="44" x2="63" y2="44" stroke="#0B6B3A" stroke-width="3" stroke-linecap="round" />
      <line x1="38" y1="18" x2="35" y2="52" stroke="#0B6B3A" stroke-width="3" stroke-linecap="round" />
      <line x1="50" y1="18" x2="49" y2="52" stroke="#0B6B3A" stroke-width="3" stroke-linecap="round" />
      <line x1="62" y1="18" x2="63" y2="52" stroke="#0B6B3A" stroke-width="3" stroke-linecap="round" />
      <!-- Cart Wheels -->
      <circle cx="34" cy="62" r="5" stroke="#0B6B3A" stroke-width="4" fill="#FFFFFF" />
      <circle cx="62" cy="62" r="5" stroke="#0B6B3A" stroke-width="4" fill="#FFFFFF" />
    </g>

    <!-- 2. Leaf Accent on 'C' -->
    <g id="leaf-accent" transform="translate(74, 52)">
      <!-- 3D Shadow -->
      <path d="M 0 28 C 0 10, 18 0, 32 6 C 36 8, 30 18, 20 24 C 12 28, 4 30, 0 28 Z" transform="translate(3, 4)" fill="#053F21" />
      <!-- Front Leaf -->
      <path d="M 0 28 C 0 10, 18 0, 32 6 C 36 8, 30 18, 20 24 C 12 28, 4 30, 0 28 Z" fill="#0B6B3A" />
    </g>

    <!-- 3. CHOLTI Text with 3D Depth Block Effect -->
    <g id="text-cholti" font-family="'Plus Jakarta Sans', 'Arial Black', Impact, sans-serif" font-weight="900" font-size="76" letter-spacing="-1">
      <!-- 3D Extrusion Shadow Layer in deep forest shade -->
      <g fill="#053F21">
        <!-- Letter C -->
        <text x="39" y="169">C</text>
        <!-- Letter H -->
        <text x="96" y="169">H</text>
        <!-- Letter O -->
        <text x="160" y="169">O</text>
        <!-- Letter L -->
        <text x="229" y="169">L</text>
        <!-- Letter T -->
        <text x="277" y="169">T</text>
        <!-- Letter I & dot -->
        <text x="329" y="169">I</text>
      </g>
      <!-- Middle Offset Layer for Solid 3D Extrusion -->
      <g fill="#074E2A">
        <text x="38" y="167">C</text>
        <text x="95" y="167">H</text>
        <text x="159" y="167">O</text>
        <text x="228" y="167">L</text>
        <text x="276" y="167">T</text>
        <text x="328" y="167">I</text>
      </g>
      <!-- Front Face Layer in Official Forest Green -->
      <g fill="#0B6B3A">
        <text x="36" y="164">C</text>
        <text x="93" y="164">H</text>
        <text x="157" y="164">O</text>
        <text x="226" y="164">L</text>
        <text x="274" y="164">T</text>
        <text x="326" y="164">I</text>
      </g>
      <!-- Distinct round solid dot for letter 'I' with 3D effect -->
      <circle cx="338" cy="88" r="9.5" fill="#053F21" />
      <circle cx="336" cy="85" r="9.5" fill="#0B6B3A" />
    </g>

    <!-- 4. MART Text in Bright Grass Green with 3D Depth -->
    <g id="text-mart" font-family="'Plus Jakarta Sans', 'Arial Black', Impact, sans-serif" font-weight="900" font-size="64" letter-spacing="1">
      <!-- 3D Shadow Layer -->
      <g fill="#27611E">
        <text x="93" y="235">M</text>
        <text x="155" y="235">A</text>
        <text x="207" y="235">R</text>
        <text x="257" y="235">T</text>
      </g>
      <!-- Middle Offset Layer -->
      <g fill="#367F2B">
        <text x="92" y="233">M</text>
        <text x="154" y="233">A</text>
        <text x="206" y="233">R</text>
        <text x="256" y="233">T</text>
      </g>
      <!-- Front Face Layer in Official Grass Green -->
      <g fill="#4CA338">
        <text x="90" y="230">M</text>
        <text x="152" y="230">A</text>
        <text x="204" y="230">R</text>
        <text x="254" y="230">T</text>
      </g>
    </g>
  </g>
</svg>
